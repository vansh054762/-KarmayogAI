<!-- ══ Profile Edit Modal ═══════════════════════════════════════════════ -->
<div id="profile-modal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(20,10,4,.55);backdrop-filter:blur(4px);align-items:center;justify-content:center;">
  <div style="background:var(--card);border-radius:var(--r-xl);padding:28px 28px 24px;width:100%;max-width:440px;margin:20px;box-shadow:var(--shadow-md);position:relative;">

    <!-- Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div style="font-family:var(--serif);font-size:17px;font-weight:700;color:var(--ink);">Edit Profile</div>
      <button onclick="closeProfileModal()" style="background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Error / success messages -->
    <div id="pm-err"  style="display:none;padding:9px 12px;border-radius:var(--r-sm);font-size:12.5px;background:var(--red-pale);color:var(--red);border:1px solid #E0B0A8;margin-bottom:12px;"></div>
    <div id="pm-ok"   style="display:none;padding:9px 12px;border-radius:var(--r-sm);font-size:12.5px;background:var(--green-pale);color:var(--green);border:1px solid #88B890;margin-bottom:12px;"></div>

    <!-- Profile fields -->
    <div class="f-group">
      <label class="f-label">Full Name</label>
      <input id="pm-name" type="text" class="f-input" placeholder="Your full name">
    </div>
    <div class="g2">
      <div class="f-group">
        <label class="f-label">Department</label>
        <input id="pm-dept" type="text" class="f-input" placeholder="e.g. MoSPI">
      </div>
      <div class="f-group">
        <label class="f-label">Designation</label>
        <input id="pm-desig" type="text" class="f-input" placeholder="e.g. Statistical Officer">
      </div>
    </div>

    <!-- Divider -->
    <div style="border-top:1px solid var(--border);margin:16px 0;"></div>
    <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:10px;">Change Password <span style="font-weight:400;">(leave blank to keep current)</span></div>

    <div class="f-group">
      <label class="f-label">Current Password</label>
      <input id="pm-cur-pw" type="password" class="f-input" placeholder="Current password">
    </div>
    <div class="g2">
      <div class="f-group">
        <label class="f-label">New Password</label>
        <input id="pm-new-pw" type="password" class="f-input" placeholder="New password">
      </div>
      <div class="f-group">
        <label class="f-label">Confirm New</label>
        <input id="pm-conf-pw" type="password" class="f-input" placeholder="Repeat new password">
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-top:4px;">
      <button onclick="closeProfileModal()" class="btn btn-secondary" style="flex:1;">Cancel</button>
      <button id="pm-save" onclick="saveProfile()" class="btn btn-primary" style="flex:2;">Save Changes</button>
    </div>
  </div>
</div>

<script>
function openProfileModal() {
  const u = (typeof getUser === 'function') ? getUser() : null;
  if (u) {
    document.getElementById('pm-name').value   = u.name        || '';
    document.getElementById('pm-dept').value   = u.department  || '';
    document.getElementById('pm-desig').value  = u.designation || '';
  }
  ['pm-cur-pw','pm-new-pw','pm-conf-pw'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('pm-err').style.display = 'none';
  document.getElementById('pm-ok').style.display  = 'none';
  const m = document.getElementById('profile-modal');
  m.style.display = 'flex';
}

function closeProfileModal() {
  document.getElementById('profile-modal').style.display = 'none';
}

// Close on backdrop click
document.getElementById('profile-modal').addEventListener('click', function(e) {
  if (e.target === this) closeProfileModal();
});

async function saveProfile() {
  const btn   = document.getElementById('pm-save');
  const errEl = document.getElementById('pm-err');
  const okEl  = document.getElementById('pm-ok');
  errEl.style.display = 'none';
  okEl.style.display  = 'none';

  const name   = document.getElementById('pm-name').value.trim();
  const dept   = document.getElementById('pm-dept').value.trim();
  const desig  = document.getElementById('pm-desig').value.trim();
  const curPw  = document.getElementById('pm-cur-pw').value;
  const newPw  = document.getElementById('pm-new-pw').value;
  const confPw = document.getElementById('pm-conf-pw').value;

  if (!name) { errEl.textContent = 'Name is required.'; errEl.style.display='block'; return; }
  if (newPw && newPw !== confPw) { errEl.textContent = 'New passwords do not match.'; errEl.style.display='block'; return; }
  if (newPw && !curPw) { errEl.textContent = 'Enter your current password to set a new one.'; errEl.style.display='block'; return; }

  const body = { name, department: dept, designation: desig };
  if (newPw) { body.current_password = curPw; body.new_password = newPw; }

  btn.innerHTML = '<span class="spinner-sm"></span> Saving…'; btn.disabled = true;

  try {
    const token = (typeof getToken === 'function') ? getToken() : localStorage.getItem('token');
    const res = await fetch('/api/auth/profile', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Update failed');

    // Update local storage & sidebar display
    localStorage.setItem('user', JSON.stringify(data));
    const ne = document.getElementById('user-name'); if (ne) ne.textContent = data.name || '';
    const re = document.getElementById('user-role'); if (re) re.textContent = data.designation || (data.role === 'admin' ? 'Administrator' : 'Employee');
    const ae = document.getElementById('user-avatar'); if (ae && data.name) ae.textContent = data.name[0].toUpperCase();

    okEl.textContent = 'Profile updated successfully!'; okEl.style.display = 'block';
    ['pm-cur-pw','pm-new-pw','pm-conf-pw'].forEach(id => { document.getElementById(id).value = ''; });
    setTimeout(closeProfileModal, 1400);
  } catch(e) {
    errEl.textContent = e.message; errEl.style.display = 'block';
  } finally {
    btn.innerHTML = 'Save Changes'; btn.disabled = false;
  }
}
</script>
