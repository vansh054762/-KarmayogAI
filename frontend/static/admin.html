<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KarmayogAI — Admin Dashboard</title>
<link rel="stylesheet" href="/static/theme.css?v=4">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="shell"></div>
<div class="sidebar-pad">

  <div class="topbar">
    <div>
      <div class="topbar-title">Admin Dashboard</div>
      <div class="topbar-sub">Platform-wide analytics and user management</div>
    </div>
    <span class="badge badge-prof" style="font-size:11px;padding:5px 12px;">🛡 ADMIN ONLY</span>
  </div>

  <div class="page" id="main">
    <div class="spinner"></div>
  </div>
</div>

<script src="/static/app.js"></script>
<script>
if (!requireAuth()) throw 0;
const _u = getUser();
if (_u && _u.role !== 'admin') { location.href='/dashboard'; throw 0; }

async function init() {
  const r = await fetch('/static/shell.html');
  document.getElementById('shell').innerHTML = await r.text();
  const user = await renderShell('Admin Dashboard','admin');
  if (!user || user.role !== 'admin') { location.href='/dashboard'; return; }

  const [sd, ud, ml] = await Promise.all([
    apiFetch('/admin/stats'),
    apiFetch('/admin/users'),
    apiFetch('/ml/model-stats')
  ]);
  const stats = sd.platform_stats || {};
  const comps = sd.competency_analytics || [];
  const users = ud.users || [];

  const cards = [
    { icon:'👥', label:'Total Users',       val: stats.total_users||0,          bg:'#F5F0E8' },
    { icon:'📊', label:'Total Assessments', val: stats.total_assessments||0,     bg:'#EDE7DC' },
    { icon:'📚', label:'Total Enrollments', val: stats.total_enrollments||0,     bg:'#EAF0E4' },
    { icon:'✅', label:'Completions',       val: stats.total_completions||0,     bg:'#F5F0DC' },
    { icon:'⚡', label:'Active Users (7d)', val: stats.active_users_7d||0,      bg:'#EDE7DC' },
    { icon:'📈', label:'Completion Rate',   val:`${stats.completion_rate||0}%`,  bg:'#E8EDE8' },
  ];

  document.getElementById('main').innerHTML = `

    <!-- Banner -->
    <div style="background:linear-gradient(135deg,#2A1A0E,#4A2E1A);border-radius:16px;padding:22px 26px;margin-bottom:20px;color:#FEFCF8;display:flex;align-items:center;gap:16px;">
      <span style="font-size:32px;">🛡️</span>
      <div>
        <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#A89080;">Administrator</div>
        <div style="font-family:var(--serif);font-size:20px;font-weight:700;margin-top:2px;">Admin Control Panel</div>
        <div style="font-size:13px;color:#C4956A;margin-top:2px;">Logged in as <strong style="color:#FEFCF8;">${user.name}</strong></div>
      </div>
    </div>

    <!-- Stat cards -->
    <div class="g4" style="margin-bottom:20px;">
      ${cards.map(c=>`
        <div class="stat fade-up">
          <div class="stat-icon" style="background:${c.bg};">${c.icon}</div>
          <div class="stat-val">${c.val}</div>
          <div class="stat-label">${c.label}</div>
        </div>`).join('')}
    </div>

    <!-- Chart + Gaps -->
    <div class="g2" style="margin-bottom:20px;">
      <div class="card">
        <div class="card-hd"><div class="card-title">Avg Score by Competency</div></div>
        <div class="card-bd">
          ${comps.length ? `<canvas id="compChart" height="260"></canvas>`
            : `<div style="text-align:center;padding:40px 0;color:var(--dim);">No assessment data yet</div>`}
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div class="card">
          <div class="card-hd"><div class="card-title" style="color:var(--red);">⚠ Weakest Areas</div></div>
          <div class="card-bd">
            ${(sd.weakest_competencies||[]).length
              ? sd.weakest_competencies.map(c=>`
                <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
                  <div>
                    <div style="font-weight:600;font-size:13px;">${c.competency}</div>
                    <div style="font-size:11px;color:var(--light);">${c.assessments_taken} assessments · ${c.users_assessed} users</div>
                  </div>
                  ${gapBadge(c.avg_score)}
                </div>`).join('')
              : `<p style="font-size:13px;color:var(--dim);padding:12px 0;">No data yet</p>`}
          </div>
        </div>
        <div class="card">
          <div class="card-hd"><div class="card-title" style="color:var(--green);">✓ Strongest Areas</div></div>
          <div class="card-bd">
            ${(sd.strongest_competencies||[]).map(c=>`
              <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
                <div>
                  <div style="font-weight:600;font-size:13px;">${c.competency}</div>
                  <div style="font-size:11px;color:var(--light);">${c.users_assessed} users</div>
                </div>
                ${gapBadge(c.avg_score)}
              </div>`).join('')}
          </div>
        </div>
      </div>
    </div>

    <!-- AI Model stats -->
    <div class="card" style="margin-bottom:20px;">
      <div class="card-hd">
        <div class="card-title">AI Model Performance</div>
        <span class="badge badge-prof">${ml.loaded ? '● Models Loaded' : '○ Not Loaded'}</span>
      </div>
      <div class="card-bd">
        <div class="g3">
          <div style="text-align:center;background:var(--bg2);border-radius:12px;padding:18px;">
            <div style="font-family:var(--serif);font-size:28px;font-weight:700;color:var(--ink);">${ml.gap_classifier_accuracy||0}%</div>
            <div style="font-size:13px;font-weight:600;color:var(--ink2);margin-top:4px;">Gap Classifier</div>
            <div style="font-size:11px;color:var(--dim);margin-top:2px;">Random Forest · Accuracy</div>
          </div>
          <div style="text-align:center;background:var(--bg2);border-radius:12px;padding:18px;">
            <div style="font-family:var(--serif);font-size:28px;font-weight:700;color:var(--ink);">±${ml.score_predictor_mae||0}</div>
            <div style="font-size:13px;font-weight:600;color:var(--ink2);margin-top:4px;">Score Predictor</div>
            <div style="font-size:11px;color:var(--dim);margin-top:2px;">Gradient Boosting · MAE</div>
          </div>
          <div style="text-align:center;background:var(--bg2);border-radius:12px;padding:18px;">
            <div style="font-family:var(--serif);font-size:28px;font-weight:700;color:var(--ink);">${ml.completion_predictor_accuracy||0}%</div>
            <div style="font-size:13px;font-weight:600;color:var(--ink2);margin-top:4px;">Completion Predictor</div>
            <div style="font-size:11px;color:var(--dim);margin-top:2px;">Random Forest · Accuracy</div>
          </div>
        </div>
        <p style="font-size:12px;color:var(--dim);margin-top:14px;">
          Trained on ${ml.training_rows?.assessments||0} assessment records + ${ml.training_rows?.enrollments||0} enrollment records.
        </p>
      </div>
    </div>

    <!-- Users table -->
    <div class="card">
      <div class="card-hd">
        <div class="card-title">All Users <span style="font-weight:400;color:var(--muted);font-size:13px;">(${users.length})</span></div>
      </div>
      <div class="card-bd" style="padding-top:0;">
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th>Name</th><th>Email</th><th>Department</th>
              <th>Avg Score</th><th>Assessments</th><th>Completed</th><th>Joined</th>
            </tr></thead>
            <tbody>
              ${users.map(u=>`
              <tr>
                <td style="font-weight:600;">${u.name}</td>
                <td style="font-size:12px;color:var(--light);">${u.email}</td>
                <td style="color:var(--muted);">${u.department||'—'}</td>
                <td>${u.avg_score!==null ? gapBadge(u.avg_score) : '<span style="color:var(--dim);font-size:12px;">—</span>'}</td>
                <td style="text-align:center;color:var(--muted);">${u.assessments_taken}</td>
                <td style="text-align:center;color:var(--muted);">${u.courses_completed}</td>
                <td style="font-size:12px;color:var(--dim);">${new Date(u.created_at).toLocaleDateString()}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;

  if (comps.length) {
    new Chart(document.getElementById('compChart'), {
      type: 'bar',
      data: {
        labels: comps.map(c=>c.competency.split(' ').slice(0,2).join(' ')),
        datasets: [{ data: comps.map(c=>c.avg_score), backgroundColor: comps.map(c=>gapColor(c.avg_score)), borderRadius: 5 }]
      },
      options: { scales:{ y:{min:0,max:100,ticks:{font:{size:11}}}, x:{ticks:{font:{size:10}}} }, plugins:{legend:{display:false}} }
    });
  }
}

init().catch(console.error);
</script>
</body>
</html>
