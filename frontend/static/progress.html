<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KarmayogAI — My Progress</title>
<link rel="stylesheet" href="/static/theme.css?v=5">
<link rel="stylesheet" href="/static/mobile.css?v=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="shell"></div>
<div class="sidebar-pad">
  <div class="topbar">
    <div>
      <div class="topbar-title">My Progress</div>
      <div class="topbar-sub">Track your learning journey and mark course completion</div>
    </div>
  </div>
  <div class="page" id="main"><div class="spinner"></div></div>
</div>
<script src="/static/app.js"></script>
<script>
if (!requireAuth()) throw 0;
async function init(){
  const r=await fetch('/static/shell.html');
  document.getElementById('shell').innerHTML=await r.text();
  await renderShell('My Progress','progress');
  await loadPage();
}
async function loadPage(){
  const [progData,histData]=await Promise.all([apiFetch('/progress/course-progress'),apiFetch('/assessment/history')]);
  const progress=progData.progress||[];
  const history=histData.history||[];

  const completed=progress.filter(p=>p.status==='completed').length;
  const inProg=progress.filter(p=>p.status==='in_progress').length;
  const hours=progress.filter(p=>p.status==='completed').reduce((a,p)=>a+(p.duration_hours||0),0);

  const cards=[
    {icon:iconBook('#7A5540', 20),label:'Total Enrolled', val:progress.length, bg:'#F5F0E8'},
    {icon:iconCheck('#7A5540', 20),label:'Completed',       val:completed,       bg:'#EAF0E4'},
    {icon:iconPlay('#7A5540', 20),label:'In Progress',     val:inProg,          bg:'#F5F0DC'},
    {icon:iconTime('#7A5540', 20),label:'Hours Learned',   val:hours.toFixed(1)+'h', bg:'#EDE7DC'},
  ];

  let html=`
    <div class="g4" style="margin-bottom:20px;">
      ${cards.map(c=>`<div class="stat fade-up"><div class="stat-icon" style="background:${c.bg};display:flex;align-items:center;justify-content:center;">${c.icon}</div><div class="stat-val">${c.val}</div><div class="stat-label">${c.label}</div></div>`).join('')}
    </div>

    <div class="g2" style="margin-bottom:20px;">
      <div class="card"><div class="card-hd"><div class="card-title">Course Status</div></div><div class="card-bd"><canvas id="pieChart" height="220"></canvas></div></div>
      <div class="card"><div class="card-hd"><div class="card-title">Avg Score by Competency</div></div><div class="card-bd"><canvas id="barChart" height="220"></canvas></div></div>
    </div>

    <div class="alert alert-info" style="margin-bottom:16px;">
      <span>${iconInfo('#3A6040', 16)}</span>
      <span>After finishing a course on iGOT, click <strong>Mark Complete</strong> below. In production, iGOT will sync automatically via webhook.</span>
    </div>`;

  if(progress.length){
    const scMap={completed:'badge-prof',in_progress:'badge-minor',enrolled:'badge-base',not_started:'badge-base'};
    const barCol={completed:'var(--green)',in_progress:'var(--amber)',enrolled:'var(--brown)',not_started:'var(--dim)'};
    const dCol={beginner:'var(--green)',intermediate:'var(--amber)',advanced:'var(--red)'};
    html+=`
    <div class="card" style="margin-bottom:20px;">
      <div class="card-hd"><div class="card-title">Course Progress</div><span style="font-size:13px;color:var(--muted);">${progress.length} courses</span></div>
      <div class="card-bd" style="padding-top:0;">
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>Course</th><th>Difficulty</th><th>Progress</th><th>Status</th><th>Started</th><th>Action</th></tr></thead>
            <tbody>
              ${progress.map(p=>`
              <tr id="row-${p.course_id}">
                <td style="font-weight:600;">${p.course_title}</td>
                <td style="font-size:12px;font-weight:700;color:${dCol[p.difficulty]||'var(--muted)'};">${p.difficulty}</td>
                <td style="width:140px;">
                  <div style="display:flex;align-items:center;gap:8px;">
                    <div class="prog-wrap" style="height:7px;flex:1;">
                      <div id="bar-${p.course_id}" class="prog-fill${p.status==='completed'?' green':''}" style="width:${p.progress_pct||0}%;"></div>
                    </div>
                    <span id="pct-${p.course_id}" style="font-size:11px;color:var(--muted);width:32px;">${(p.progress_pct||0).toFixed(0)}%</span>
                  </div>
                </td>
                <td><span class="badge ${scMap[p.status]||'badge-base'}" id="stat-${p.course_id}">${p.status.replace('_',' ')}</span></td>
                <td style="font-size:12px;color:var(--dim);">${p.started_at?new Date(p.started_at).toLocaleDateString():'—'}</td>
                <td>
                  ${p.status==='completed'
                    ?`<span style="font-size:12px;font-weight:600;color:var(--green);">✓ Done</span>`
                    :`<button id="btn-${p.course_id}" onclick="markComplete(${p.course_id})" class="btn btn-success btn-sm">✓ Mark Complete</button>`}
                </td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
  } else {
    html+=`<div class="card" style="text-align:center;padding:48px 24px;margin-bottom:20px;"><div style="font-size:36px;margin-bottom:12px;color:#7A5540;">${iconBook('currentColor', 40)}</div><p style="color:var(--muted);">No courses enrolled yet. <a href="/recommendations" style="color:var(--brown);font-weight:600;">Get recommendations</a></p></div>`;
  }

  if(history.length){
    html+=`
    <div class="card">
      <div class="card-hd"><div class="card-title">Assessment History</div></div>
      <div class="card-bd" style="padding-top:0;">
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>Competency</th><th>Score</th><th>Correct</th><th>Date</th></tr></thead>
            <tbody>
              ${history.slice(0,25).map(r=>`
              <tr>
                <td style="font-weight:600;">${r.competency_name}</td>
                <td>${gapBadge(r.score)}</td>
                <td style="color:var(--muted);">${r.correct_answers}/${r.total_questions}</td>
                <td style="font-size:12px;color:var(--dim);">${new Date(r.taken_at).toLocaleString()}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
  }

  document.getElementById('main').innerHTML=html;

  // Charts
  const sc={};
  progress.forEach(p=>sc[p.status]=(sc[p.status]||0)+1);
  const pieColors={completed:'#3A6040',in_progress:'#A07020',enrolled:'#7A5540',not_started:'#C4B0A0'};
  if(Object.keys(sc).length){
    new Chart(document.getElementById('pieChart'),{type:'doughnut',
      data:{labels:Object.keys(sc).map(s=>s.replace('_',' ')),datasets:[{data:Object.values(sc),backgroundColor:Object.keys(sc).map(s=>pieColors[s]||'#ccc'),borderWidth:0}]},
      options:{plugins:{legend:{position:'bottom',labels:{font:{size:11},color:'#7A6355'}}},cutout:'62%'}});
  }
  const hbc={};
  history.forEach(r=>{hbc[r.competency_name]=hbc[r.competency_name]||[]; hbc[r.competency_name].push(r.score);});
  const avg=Object.entries(hbc).map(([n,s])=>({name:n.split(' ').slice(0,2).join(' '),avg:Math.round(s.reduce((a,b)=>a+b,0)/s.length)}));
  if(avg.length){
    new Chart(document.getElementById('barChart'),{type:'bar',
      data:{labels:avg.map(c=>c.name),datasets:[{data:avg.map(c=>c.avg),backgroundColor:avg.map(c=>gapColor(c.avg)),borderRadius:5}]},
      options:{scales:{y:{min:0,max:100,ticks:{font:{size:11}}},x:{ticks:{font:{size:10}}}},plugins:{legend:{display:false}}}});
  }
}

async function markComplete(courseId){
  const btn=document.getElementById(`btn-${courseId}`);
  if(btn){btn.textContent='Saving…';btn.disabled=true;}
  try{
    await apiFetch('/progress/update-course',{method:'POST',body:JSON.stringify({course_id:courseId,progress_pct:100})});
    await apiFetch('/igot/sync-progress',{method:'POST',body:JSON.stringify({course_id:courseId,progress_pct:100})}).catch(()=>{});
    showToast('Course marked as complete!');
    const bar=document.getElementById(`bar-${courseId}`); if(bar){bar.style.width='100%';bar.classList.add('green');}
    const pct=document.getElementById(`pct-${courseId}`); if(pct) pct.textContent='100%';
    const stat=document.getElementById(`stat-${courseId}`); if(stat){stat.className='badge badge-prof';stat.textContent='completed';}
    if(btn) btn.outerHTML=`<span style="font-size:12px;font-weight:600;color:var(--green);">✓ Done</span>`;
  } catch(e){ showToast(e.message,'err'); if(btn){btn.textContent='✓ Mark Complete';btn.disabled=false;} }
}
init().catch(console.error);
</script>
</body>
</html>
